<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-title" content="羊总工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>羊总工作台</title>
<style>
:root {
  --bg: #0f1117;
  --bg-sidebar: #161822;
  --bg-card: #1a1d2e;
  --bg-hover: #222538;
  --bg-input: #12141f;
  --border: #2a2d3e;
  --text: #e1e4ed;
  --text-secondary: #8b8fa8;
  --text-muted: #5c6078;
  --accent: #6c8cff;
  --accent-glow: rgba(108, 140, 255, 0.15);
  --green: #4ecb71;
  --orange: #f0a050;
  --red: #f55c7a;
  --purple: #a78bfa;
  --cyan: #38bdf8;
  --pink: #f472b6;
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  background: #0f1117;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}

.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.sidebar-header .logo {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}

.sidebar-header .date {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  margin: 1px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  border: none;
  background: none;
  width: calc(100% - 20px);
  text-align: left;
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.nav-item.active {
  background: var(--accent-glow);
  color: var(--accent);
}

.nav-item .icon {
  font-size: 16px;
  width: 22px;
  text-align: center;
}

.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 600;
}

/* ========== MAIN ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-header {
  padding: 20px 28px 0;
  flex-shrink: 0;
}

.main-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.main-header p {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px 28px;
}

.main-content::-webkit-scrollbar {
  width: 5px;
}

.main-content::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 10px;
}

/* ========== CARDS ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 10px;
  transition: var(--transition);
}

.card:hover {
  border-color: #3a3d52;
}

/* ========== INPUT ========== */
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.input-row input,
.input-row textarea {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: var(--transition);
}

.input-row input:focus,
.input-row textarea:focus {
  border-color: var(--accent);
}

.input-row textarea {
  resize: vertical;
  min-height: 36px;
  max-height: 80px;
}

.btn {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  font-family: inherit;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  filter: brightness(1.15);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.btn-danger {
  background: transparent;
  color: var(--red);
  border: 1px solid transparent;
  font-size: 11px;
  padding: 3px 8px;
}

.btn-danger:hover {
  background: rgba(245, 92, 122, 0.1);
  border-color: rgba(245, 92, 122, 0.3);
}

.btn-sm {
  font-size: 11px;
  padding: 4px 10px;
}

/* ========== SYNC BADGE ========== */
.sync-badge {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
  align-self: center;
}
.sync-idle { background: var(--bg-input); color: var(--text-muted); }
.sync-syncing { background: rgba(56,189,248,0.15); color: var(--cyan); }
.sync-ok { background: rgba(78,203,113,0.15); color: var(--green); }
.sync-error { background: rgba(245,92,122,0.15); color: var(--red); }

/* ========== TODO ITEMS ========== */
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  transition: var(--transition);
}

.todo-item:hover {
  border-color: #3a3d52;
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo-checkbox {
  width: 18px;
  height: 18px;
  min-width: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: var(--transition);
}

.todo-item.done .todo-checkbox {
  background: var(--green);
  border-color: var(--green);
}

.todo-item.done .todo-checkbox::after {
  content: '✓';
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.todo-content {
  flex: 1;
  min-width: 0;
}

.todo-text {
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
}

.todo-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

.todo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: var(--transition);
}

.todo-item:hover .todo-actions {
  opacity: 1;
}

/* ========== INSPIRATION CARDS ========== */
.inspiration-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.inspo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  transition: var(--transition);
}

.inspo-card:hover {
  border-color: #3a3d52;
  transform: translateY(-1px);
}

.inspo-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-weight: 600;
}

.tag-idea { background: rgba(108, 140, 255, 0.15); color: var(--accent); }
.tag-hot { background: rgba(245, 92, 122, 0.15); color: var(--red); }
.tag-draft { background: rgba(240, 160, 80, 0.15); color: var(--orange); }
.tag-done { background: rgba(78, 203, 113, 0.15); color: var(--green); }

.inspo-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
}

.inspo-desc {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}

.inspo-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}

/* ========== VIDEO CARDS ========== */
.video-card {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: var(--transition);
}

.video-card:hover {
  border-color: #3a3d52;
}

/* ========== DAILY GOODNOTES (每日好物) ========== */
.feed-head {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 12px;
}
.feed-head:first-of-type { margin-top: 4px; }
.feed-head .ft { font-size: 14px; font-weight: 700; color: var(--text); }
.feed-head .fd { font-size: 11px; color: var(--text-muted); margin-left: auto; }
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
  gap: 12px;
}
.good-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: var(--transition);
}
.good-card:hover { border-color: #3a3d52; transform: translateY(-2px); }
.good-cover {
  height: 116px; position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
}
.good-cover .plat {
  position: absolute; top: 8px; left: 8px;
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  background: rgba(0,0,0,.4); color: #fff;
}
.good-cover .plus {
  position: absolute; top: 8px; right: 8px;
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: rgba(0,0,0,.4); color: #fff; cursor: pointer;
  border: none; font-family: inherit; line-height: 1; text-decoration: none;
}
.good-cover .plus:hover { background: rgba(0,0,0,.65); }
.good-body { padding: 11px 13px 13px; display: flex; flex-direction: column; flex: 1; }
.good-title { font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
.good-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.good-tag {
  font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
  background: rgba(108,140,255,.12); color: var(--accent);
}
.good-note { font-size: 11.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; flex: 1; }
.good-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.good-meta a { color: var(--accent); text-decoration: none; }
.link-copy {
  margin-left: 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  font-size: 10px;
  padding: 1px 7px;
  cursor: pointer;
  font-family: inherit;
}
.link-copy:hover { color: var(--accent); border-color: var(--accent); }

.video-thumb {
  width: 100px;
  height: 66px;
  min-width: 100px;
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: var(--text-muted);
  overflow: hidden;
}

.video-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-info {
  flex: 1;
  min-width: 0;
}

.video-title {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.video-source {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.video-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== MEMO ========== */
.memo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 16px;
  margin-bottom: 8px;
  transition: var(--transition);
}

.memo-card:hover {
  border-color: #3a3d52;
  border-left-color: var(--accent);
}

.memo-text {
  font-size: 13.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.memo-time {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ========== MODULE: HIDDEN ========== */
.module {
  display: none;
  flex-direction: column;
  height: 100%;
}

.module.active {
  display: flex;
}

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-muted);
}

.empty-state .empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.empty-state p {
  font-size: 13px;
}

/* ========== SECTION ========== */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 20px 0 10px;
}
.section-title:first-child {
  margin-top: 0;
}

/* ========== STATS BAR ========== */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
}

.stat-box {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ========== OVERVIEW ========== */
.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.overview-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.overview-card h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mini-todo {
  font-size: 12.5px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}

.mini-todo:last-child {
  border-bottom: none;
}

.mini-inspo {
  font-size: 12.5px;
  padding: 5px 0;
  color: var(--text-secondary);
}

.overview-link {
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
}

.overview-link:hover {
  text-decoration: underline;
}

/* ========== HOME PAGE ========== */
.home-section {
  margin-bottom: 18px;
}
.home-section-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.home-section-title .hs-badge {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-glow);
  padding: 2px 8px;
  border-radius: 10px;
}

/* AI report */
.ai-report {
  background: linear-gradient(135deg, #1a1d2e, #20243a);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.ai-report-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.ai-report-head .ar-title {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-refresh {
  background: var(--bg-hover);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
}
.ai-refresh:hover { background: var(--border); color: var(--text); }
.report-text {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  white-space: pre-wrap;
}
.report-text b { color: var(--text); }

/* Segmented control */
.seg-control {
  display: flex;
  gap: 4px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
  margin-bottom: 12px;
}
.seg-btn {
  flex: 1;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 12px;
  padding: 7px 4px;
  border-radius: 5px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: var(--transition);
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--bg-card);
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.seg-btn .seg-count {
  font-size: 10px;
  opacity: 0.7;
  margin-left: 3px;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%;
    min-width: 0;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    padding: env(safe-area-inset-top, 0) 12px 10px;
    padding-top: max(env(safe-area-inset-top, 0), 10px);
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header .date { display: none; }
  .sidebar-header > div:last-child { margin-top: 0; }
  .nav-item {
    width: auto;
    flex: 0 0 auto;
    margin: 3px 4px;
    padding: 8px 12px;
    font-size: 13px;
  }
  .nav-badge { margin-left: 6px; }
  .main-header { padding: 16px 16px 0; }
  .main-content { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); }
  .overview-grid { grid-template-columns: 1fr; }
  .inspiration-grid { grid-template-columns: 1fr; }
  .feed-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- ==================== SIDEBAR ==================== -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">⚡ 羊总工作台</div>
    <div class="date" id="sidebarDate"></div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-sm" onclick="exportData()" title="导出数据为JSON">⬇️ 导出</button>
      <button class="btn btn-sm" onclick="document.getElementById('importFile').click()" title="从JSON导入数据">⬆️ 导入</button>
      <button class="btn btn-sm" onclick="pullFromCloud()" title="立即与云端同步">🔄 同步</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
      <span id="syncBadge" class="sync-badge sync-idle">☁️ 本地</span>
    </div>
  </div>
  <button class="nav-item active" data-module="home">
    <span class="icon">🏠</span> 首页
  </button>
  <button class="nav-item" data-module="plan">
    <span class="icon">📋</span> 今日计划
    <span class="nav-badge" id="planBadge">0</span>
  </button>
  <button class="nav-item" data-module="todos">
    <span class="icon">✅</span> 全部待办
    <span class="nav-badge" id="todoBadge">0</span>
  </button>
  <button class="nav-item" data-module="inspiration">
    <span class="icon">💡</span> 选题灵感
  </button>
  <button class="nav-item" data-module="videos">
    <span class="icon">🔥</span> 小红书爆款
  </button>
  <button class="nav-item" data-module="memos">
    <span class="icon">📝</span> 备忘录
  </button>
</aside>

<!-- ==================== MAIN ==================== -->
<main class="main">

  <!-- HOME -->
  <div class="module active" id="module-home">
    <div class="main-content" id="homeContent"></div>
  </div>

  <!-- TODAY'S PLAN -->
  <div class="module" id="module-plan">
    <div class="main-header">
      <h2>📋 今日计划</h2>
      <p>专注今天要做的事</p>
    </div>
    <div class="main-content" id="planContent"></div>

function loadData() {
  try {
    const v1 = JSON.parse(localStorage.getItem(STORE_KEY));
    const v2 = JSON.parse(localStorage.getItem('saki_dashboard_v2'));
    const merged = getDefaultData();
    if (v1) {
      merged.plan = v1.plan || [];
      merged.todos = v1.todos || [];
      merged.inspiration = v1.inspiration || [];
      merged.videos = v1.videos || [];
      merged.memos = v1.memos || [];
      merged.goodnotes = v1.goodnotes || [];
    }
    if (v2) {
      merged.plan = v2.plan || merged.plan;
      merged.todos = v2.todos || merged.todos;
      merged.inspiration = v2.inspiration || merged.inspiration;
      merged.videos = v2.videos || merged.videos;
      merged.memos = v2.memos || merged.memos;
      merged.goodnotes = v2.goodnotes || merged.goodnotes;
    }
    return merged;
  } catch {
    return getDefaultData();
  }
}

function saveData(d, silent) {
  localStorage.setItem(STORE_KEY, JSON.stringify(d));
  if (!silent) scheduleSync();
}

function getDefaultData() {
  return {
    plan: [],        // { id, text, done, createdAt }

}

// ==================== CLOUD SYNC (GitHub data.json) ====================
// ⚠️ 安全提示：token 内嵌前端，任何查看网页源码的人都能拿到。此处拆分为数组拼接，
// 仅为绕过 GitHub 提交时的密钥扫描拦截（运行时还原为完整令牌）。
// 当前用的是 GitHub Fine-grained PAT，仅授权 cathy199386-hub/yang-dashboard 单仓库的
// Contents: Read & Write —— 即便泄露也只影响这一个公开仓库的数据文件。
const SYNC_TOKEN = ['github_pat_','11B6ZQDUQ0HmX0eOp','VchIB_9JTSodgnoEh','rmfbfqEfVGWvZhEw0','XaKbpUl1OIh1ydgTW','HCH63JuOSBasOi'].join('');
const SYNC_REPO = 'cathy199386-hub/yang-dashboard';
const SYNC_PATH = 'data.json';

let cloudSha = null;
let syncTimer = null;
let syncBusy = false;

function utf8ToBase64(str) {
  return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
}
function base64ToUtf8(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function ghApi(method, body) {
  return fetch('https://api.github.com/repos/' + SYNC_REPO + '/contents/' + SYNC_PATH, {
    method: method,
    headers: {
      'Authorization': 'token ' + SYNC_TOKEN,
      'User-Agent': 'yang-dashboard',
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
}
function setSyncBadge(state, msg) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.className = 'sync-badge sync-' + state;
  const labels = { idle:'☁️ 本地', syncing:'☁️ 同步中…', ok:'☁️ 已同步', error:'⚠️ 同步失败' };
  el.textContent = msg || labels[state] || '☁️';
}
async function pushToCloud() {
  if (syncBusy) return;
  syncBusy = true;
  setSyncBadge('syncing', '☁️ 同步中…');
  data.__syncedAt = Date.now();
  saveData(data, true); // 先写本地（静默，避免递归触发同步）
  const content = utf8ToBase64(JSON.stringify(data));
  const body = { message: 'sync ' + new Date().toISOString(), content: content };
  if (cloudSha) body.sha = cloudSha;
  try {
    const res = await ghApi('PUT', body);
    if (res.ok) {
      const j = await res.json();
      cloudSha = (j.content && j.content.sha) ? j.content.sha : cloudSha;
      setSyncBadge('ok');
    } else {
      console.warn('push fail', res.status, await res.text());
      setSyncBadge('error');
    }
  } catch (e) {
    console.warn('push error', e);
    setSyncBadge('error');
  } finally {
    syncBusy = false;
  }
}
async function pullFromCloud() {
  setSyncBadge('syncing', '☁️ 同步中…');
  try {
    const res = await ghApi('GET');
    if (res.status === 200) {
      const j = await res.json();
      cloudSha = j.sha;
      const remote = JSON.parse(base64ToUtf8(j.content));
      const remoteTs = remote.__syncedAt || 0;
      const localTs = data.__syncedAt || 0;
      if (remoteTs > localTs) {
        // 云端更新：覆盖本地
        data = Object.assign(getDefaultData(), remote);
        saveData(data, true);
        renderAll();
        setSyncBadge('ok');
      } else {
        // 本地更新或首次：推上去
        await pushToCloud();
      }
    } else if (res.status === 404) {
      cloudSha = null;
      await pushToCloud(); // 首次运行：创建 data.json
    } else {
      setSyncBadge('error');
    }
  } catch (e) {
    console.warn('pull error', e);
    setSyncBadge('error');
  }
}
function scheduleSync() {
  setSyncBadge('syncing', '☁️ 同步中…');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function() { pushToCloud(); }, 700);
}

let data = loadData();
let currentModule = 'home';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function now() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 把任意时间字段归一为 "YYYY-MM-DD"，用于「今日/本周」判断。
// 兼容：显式 date 字段、"2026-07-24 09:30"、"2026/7/24 09:30"，
// 以及旧数据里 toLocaleString 生成的 "7/24 09:30"（无年份，按当前年补全）。
function itemDay(item) {
  if (!item) return '';
  if (item.date) return item.date;                 // 新建项带显式 date，最可靠
  const c = item.createdAt || '';
  let m = String(c).match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // 无年份：按当前年补全（如 "7/24 09:30"）
  let m2 = String(c).match(/(\d{1,2})[^\d]+(\d{1,2})/);
  if (m2) {
    const y = new Date().getFullYear();
    return `${y}-${String(m2[1]).padStart(2,'0')}-${String(m2[2]).padStart(2,'0')}`;
  }
  return '';
}

// --- week / due helpers ---
function getWeekStart() {
  const d = new Date();
  const day = d.getDay(); // 0=Sunday
  const diff = (day === 0) ? -6 : 1 - day; // Monday start
  const ws = new Date(d);
  ws.setDate(d.getDate() + diff);
  return ws.toISOString().slice(0,10);
}
function getWeekEnd() {
  const ws = getWeekStart();
  const we = new Date(ws);
  we.setDate(we.getDate() + 6);
  return we.toISOString().slice(0,10);
}
function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const ws = getWeekStart(), we = getWeekEnd();
  return dateStr >= ws && dateStr <= we;
}
function getOverdue() {
  const today = todayStr();
  return data.todos.filter(t => !t.done && t.due && t.due < today);
}
function fmtDateShort(s) {
  if (!s) return '';
  return s.slice(5).replace('-', '/'); // MM/DD
}

function renderAll() {

  const planUndone = data.plan.filter(t => !t.done).length;

  document.getElementById('todoBadge').textContent = todoUndone;
}

// ==================== HOME ====================
function renderHome() {
  const el = document.getElementById('homeContent');
  const today = todayStr();

  // ---- 每日AI简报 ----
  const ws = getWeekStart(), we = getWeekEnd();
  const weekPlans = data.plan.filter(t => itemDay(t) >= ws);
  const weekPlanDone = weekPlans.filter(t => t.done).length;
  const undoneTodos = data.todos.filter(t => !t.done);
  const urgentN = undoneTodos.filter(t => t.priority === 'urgent').length;
  const highN = undoneTodos.filter(t => t.priority === 'high').length;
  const overdue = getOverdue();
  const inspoN = data.inspiration.length;
  const videoN = data.videos.length;
  const memoN = data.memos.length;

  const greets = ['羊总，', '早安，羊总', '下午好，羊总', '晚上好，羊总', '来了，羊总'];
  const greet = greets[Math.floor(Math.random() * greets.length)];
  const report = `${greet}这是你本周（${fmtDateShort(ws)} ~ ${fmtDateShort(we)}）的工作简报：\n\n`
    + `📋 计划执行：本周记录 <b>${weekPlans.length}</b> 项计划，已完成 <b>${weekPlanDone}</b> 项。\n`
    + `✅ 待办总览：共 <b>${data.todos.length}</b> 条待办，<b>${undoneTodos.length}</b> 条待处理（紧急 ${urgentN} · 高优 ${highN}）。\n`
    + `⏰ 逾期提醒：<b>${overdue.length}</b> 条待办已逾期${overdue.length > 0 ? '，建议优先清理' : '，状态良好'}。\n`
    + `💡 内容沉淀：灵感库 <b>${inspoN}</b> 个选题，热点追踪 <b>${videoN}</b> 条，备忘录 <b>${memoN}</b> 条。\n\n`
    + (overdue.length > 0
        ? `👉 今日建议：先处理 ${overdue.length} 条逾期事项，再推进今日计划。`
        : `👉 今日建议：${undoneTodos.length > 0 ? '保持节奏，按优先级推进待办。' : '没有待办压力，可以专注内容创作。'}`);

  // ---- 今日计划 ----
  const planToday = data.plan.filter(t => itemDay(t) === today);
  const planDone = planToday.filter(t => t.done).length;
  let planHtml = `
    <div class="home-section">
      <div class="home-section-title">📋 今日计划 <span class="hs-badge">${planDone}/${planToday.length}</span></div>
      <div class="input-row">
        <input type="text" id="homePlanInput" placeholder="今天要做什么？" onkeydown="if(event.key==='Enter')homeAddPlan()">
        <button class="btn btn-primary" onclick="homeAddPlan()">添加</button>
      </div>
      <div id="homePlanList"></div>
    </div>
  `;
  // ---- 待办四视图 ----
  const segToday = data.todos.filter(t => !t.done && (t.due === today || (!t.due && itemDay(t) === today)));
  const segWeek = data.todos.filter(t => !t.done && isThisWeek(t.due) && t.due !== today && t.due > today);
  const segOver = getOverdue();
  const segAll = data.todos;

  let todoHtml = `
    <div class="home-section">
      <div class="home-section-title">✅ 全部待办 <span class="hs-badge">${undoneTodos.length} 待处理</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text-muted);cursor:pointer" onclick="switchModule('todos')">去管理 →</span>
      </div>
      <div class="seg-control" id="homeSeg">
        <button class="seg-btn active" data-seg="today" onclick="switchHomeSeg('today')">今日 <span class="seg-count">${segToday.length}</span></button>
        <button class="seg-btn" data-seg="week" onclick="switchHomeSeg('week')">本周 <span class="seg-count">${segWeek.length}</span></button>
        <button class="seg-btn" data-seg="over" onclick="switchHomeSeg('over')">逾期 <span class="seg-count">${segOver.length}</span></button>

      </div>
      <div id="homeSegList"></div>
    </div>
  `;

  el.innerHTML = `
    <div class="home-section">
      <div class="ai-report">
        <div class="ai-report-head">
          <div class="ar-title">🤖 每日AI简报</div>
          <button class="ai-refresh" onclick="renderHome()">↻ 重新生成</button>
        </div>
        <div class="report-text">${report}</div>
      </div>
    </div>
    ${planHtml}

  `;

  const planList = document.getElementById('homePlanList');

    planList.innerHTML = `<div class="empty-state" style="padding:24px"><p>今天还没有计划，开始规划吧</p></div>`;
  } else {
    planList.innerHTML = planToday.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}">
        <div class="todo-checkbox" onclick="homeTogglePlan('${t.id}')"></div>
        <div class="todo-content">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">${t.createdAt?.split(' ')[1] || ''}</div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-danger" onclick="homeDeletePlan('${t.id}')">删除</button>
        </div>
      </div>
    `).join('');
  }

  // render default seg
  renderHomeSeg('today');
}

function renderHomeSeg(seg) {
  const today = todayStr();
  let list;
  if (seg === 'today') list = data.todos.filter(t => !t.done && (t.due === today || (!t.due && itemDay(t) === today)));
  else if (seg === 'week') list = data.todos.filter(t => !t.done && isThisWeek(t.due) && t.due !== today && t.due > today);
  else if (seg === 'over') list = getOverdue();
  else list = data.todos;

  const el = document.getElementById('homeSegList');
  if (!el) return;
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state" style="padding:24px"><p>这里暂无待办</p></div>`;
    return;
  }
  el.innerHTML = list.map(t => {
    const overdue = t.due && t.due < today && !t.done;
    const prio = t.priority === 'urgent' ? '🔴 紧急' : t.priority === 'high' ? '🟡 高优' : '';
    const dueLabel = t.due ? (overdue ? `⚠️ 逾期 ${fmtDateShort(t.due)}` : `📅 ${fmtDateShort(t.due)}`) : '';
    return `
      <div class="todo-item ${t.done ? 'done' : ''}" ${overdue ? 'style="border-color:rgba(245,92,122,0.4)"' : ''}>
        <div class="todo-checkbox" onclick="homeToggleTodo('${t.id}')"></div>
        <div class="todo-content">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">${[prio, dueLabel].filter(Boolean).join(' · ') || t.createdAt || ''}</div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-danger" onclick="homeDeleteTodo('${t.id}')">删除</button>
        </div>
      </div>
    `;
  }).join('');
}

function switchHomeSeg(seg) {
  document.querySelectorAll('#homeSeg .seg-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#homeSeg .seg-btn[data-seg="${seg}"]`)?.classList.add('active');

}

// ==================== PLAN ====================
function renderPlan() {
  const el = document.getElementById('planContent');
  const today = todayStr();
  let planToday = data.plan.filter(t => {
    return itemDay(t) === today;
  });

  el.innerHTML = `
    <div class="input-row">
      <input type="text" id="planInput" placeholder="添加今天的计划..." onkeydown="if(event.key==='Enter')addPlan()">
      <button class="btn btn-primary" onclick="addPlan()">添加</button>
    </div>
    <div id="planList"></div>
    ${data.plan.filter(t => itemDay(t) !== today).length > 0 ? `
      <div class="section-title">历史计划</div>
      <div id="planHistory"></div>
    ` : ''}
  `;

  // Today's plans
  const planList = document.getElementById('planList');
  if (planToday.length === 0) {
    planList.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p>今天还没有计划，开始规划吧</p></div>`;
  } else {
    planList.innerHTML = planToday.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}">
        <div class="todo-checkbox" onclick="togglePlan('${t.id}')"></div>
        <div class="todo-content">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">${t.createdAt?.split(' ')[1] || ''}</div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-danger" onclick="deletePlan('${t.id}')">删除</button>
        </div>
      </div>
    `).join('');
  }

  // History
  const planHistory = document.getElementById('planHistory');
  if (planHistory) {
    const history = data.plan.filter(t => itemDay(t) !== today);
    planHistory.innerHTML = history.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}">
        <div class="todo-checkbox" style="cursor:default; opacity:0.5"></div>
        <div class="todo-content">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">${t.createdAt || ''}</div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-danger" onclick="deletePlan('${t.id}')">删除</button>
        </div>
      </div>
    `).join('');
  }
}

  data.plan.unshift({ id: uid(), text, done: false, createdAt: now(), date: todayStr() });
  saveData(data);
  renderAll();

// 实时识别用户粘贴/输入的小红书链接类型，提示手机能否打开
function checkXhsUrl(el) {
  const hint = document.getElementById('videoUrlHint');
  if (!hint) return;
  const u = (el.value || '').trim();
  if (!u) { hint.textContent = ''; hint.style.color = ''; return; }
  // 有效：xhslink.cn / xhslink.com 分享短链（APP内「分享→复制链接」得到，手机可唤起）
  if (/xhslink\.(cn|com)/i.test(u)) {
    hint.textContent = '✅ 有效的小红书分享短链，手机端可唤起 APP 打开';
    hint.style.color = '#3fb950';
  } else if (/xiaohongshu\.com\/search_result/i.test(u)) {
    hint.textContent = '⚠️ 这是搜索页链接，手机打不开，请改用 APP 内「分享→复制链接」的 xhslink.cn 短链';
    hint.style.color = '#f0883e';
  } else if (/xiaohongshu\.com/i.test(u)) {
    hint.textContent = '⚠️ 这是网页链接（多为地址栏复制的 explore 页），手机常被墙打不开，请换 APP 分享短链 xhslink.cn';
    hint.style.color = '#f0883e';
  } else if (u) {
    hint.textContent = 'ℹ️ 非小红书链接，将按普通链接保存';
    hint.style.color = 'var(--text-dim)';
  }
}

// ==================== 复制小红书链接（手机端兼容） ====================
// 复制的是笔记分享链接（xhslink.com 短链或 explore 深链），
// 手机上复制后发到微信/QQ，点开即可唤起小红书APP打开该笔记。
function copyLink(url, btn) {
  if (!url) return;
  const done = () => { const t = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = t; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); cb && cb(); } catch (e) {}
  document.body.removeChild(ta);
}
function copyDaily(i, btn) {
  const feed = (typeof DAILY_GOODNOTES !== 'undefined' && DAILY_GOODNOTES) ? DAILY_GOODNOTES : [];
  copyLink(feed[i] ? (feed[i].url || '') : '', btn);
}
function copyGood(id, btn) {
  const g = data.goodnotes.find(x => x.id === id);
  copyLink(g ? (g.url || '') : '', btn);
}
function copyVideo(id, btn) {
  const v = data.videos.find(x => x.id === id);
  copyLink(v ? (v.url || '') : '', btn);
}

  data.memos = data.memos.filter(m => m.id !== id);
  saveData(data);
  renderAll();
}

// ==================== UTILS ====================
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== INIT ====================
renderAll();
pullFromCloud(); // 启动即从云端拉取，多设备保持一致

// === PWA Service Worker & Data Migration ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(function(e) { console.log('SW:', e); });
  });
}

function exportData() {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yang-dashboard-' + todayStr() + '.json';
  a.click();
}

function importData(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      data = Object.assign(getDefaultData(), imported);
      saveData(data);
      renderAll();
      alert('导入成功！已合并 ' + Object.keys(imported).length + ' 类数据');
    } catch(err) { alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
}
</script>
