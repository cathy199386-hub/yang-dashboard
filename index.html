<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-title" content="羊总工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>羊总工作台</title>
<style>
:root {
  --bg: #0f1117;
  --bg-sidebar: #161822;
  --bg-card: #1a1d2e;
  --bg-hover: #222538;
  --bg-input: #12141f;
  --border: #2a2d3e;
  --text: #e1e4ed;
  --text-secondary: #8b8fa8;
  --text-muted: #5c6078;
  --accent: #6c8cff;
  --accent-glow: rgba(108, 140, 255, 0.15);
  --green: #4ecb71;
  --orange: #f0a050;
  --red: #f55c7a;
  --purple: #a78bfa;
  --cyan: #38bdf8;
  --pink: #f472b6;
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
  --glass-bg: rgba(255,255,255,0.07);
  --glass-border: rgba(255,255,255,0.16);
  --glass-shadow: rgba(0,0,0,0.25);
}

/* ===== 浅色主题：仅 [data-theme="light"] 或 [data-theme="auto" 且系统浅色] 生效 ===== */
:root[data-theme="light"] {
  --bg: #f4f5fa;
  --bg-sidebar: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #eef0f7;
  --bg-input: #eef1f8;
  --border: #e3e6ef;
  --text: #1a1d2e;
  --text-secondary: #5c6078;
  --text-muted: #9aa0b5;
  --accent: #4c63ff;
  --accent-glow: rgba(76,99,255,0.12);
  --green: #16a34a;
  --orange: #d97706;
  --red: #dc2626;
  --purple: #7c3aed;
  --cyan: #0284c7;
  --pink: #db2777;
  --glass-bg: rgba(255,255,255,0.42);
  --glass-border: rgba(255,255,255,0.65);
  --glass-shadow: rgba(31,41,86,0.12);
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #f4f5fa;
    --bg-sidebar: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #eef0f7;
    --bg-input: #eef1f8;
    --border: #e3e6ef;
    --text: #1a1d2e;
    --text-secondary: #5c6078;
    --text-muted: #9aa0b5;
    --accent: #4c63ff;
    --accent-glow: rgba(76,99,255,0.12);
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
    --purple: #7c3aed;
    --cyan: #0284c7;
    --pink: #db2777;
    --glass-bg: rgba(255,255,255,0.42);
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow: rgba(31,41,86,0.12);
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  background: var(--bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}

.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.sidebar-header .logo {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}

.sidebar-header .date {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  margin: 1px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  border: none;
  background: none;
  width: calc(100% - 20px);
  text-align: left;
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.nav-item.active {
  background: var(--accent-glow);
  color: var(--accent);
}

.nav-item .icon {
  font-size: 16px;
  width: 22px;
  text-align: center;
}

.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 600;
}

/* ========== MAIN ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-header {
  padding: 20px 28px 0;
  flex-shrink: 0;
}

.main-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.main-header p {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px 28px;
}

.main-content::-webkit-scrollbar {
  width: 5px;
}

.main-content::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 10px;
}

/* ========== CARDS ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 10px;
  transition: var(--transition);
}

.card:hover {
  border-color: #3a3d52;
}

/* ========== INPUT ========== */
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.input-row input,
.input-row textarea {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: var(--transition);
}

.input-row input:focus,
.input-row textarea:focus {
  border-color: var(--accent);
}

.input-row textarea {
  resize: vertical;
  min-height: 36px;
  max-height: 80px;
}

.btn {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  font-family: inherit;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  filter: brightness(1.15);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.btn-danger {
  background: transparent;
  color: var(--red);
  border: 1px solid transparent;
  font-size: 11px;
  padding: 3px 8px;
}

.btn-danger:hover {
  background: rgba(245, 92, 122, 0.1);
  border-color: rgba(245, 92, 122, 0.3);
}

.btn-sm {
  font-size: 11px;
  padding: 4px 10px;
}

/* ========== SYNC BADGE ========== */
.sync-badge {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
  align-self: center;
}
.sync-idle { background: var(--bg-input); color: var(--text-muted); }
.sync-syncing { background: rgba(56,189,248,0.15); color: var(--cyan); }
.sync-ok { background: rgba(78,203,113,0.15); color: var(--green); }
.sync-error { background: rgba(245,92,122,0.15); color: var(--red); }

/* ========== TODO ITEMS ========== */
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  transition: var(--transition);
}

.todo-item:hover {
  border-color: #3a3d52;
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo-checkbox {
  width: 18px;
  height: 18px;
  min-width: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: var(--transition);
}

.todo-item.done .todo-checkbox {
  background: var(--green);
  border-color: var(--green);
}

.todo-item.done .todo-checkbox::after {
  content: '✓';
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.todo-content {
  flex: 1;
  min-width: 0;
}

.todo-text {
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
}

.todo-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

.todo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: var(--transition);
}

.todo-item:hover .todo-actions {
  opacity: 1;
}

/* ========== INSPIRATION CARDS ========== */
.inspiration-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.inspo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  transition: var(--transition);
}

.inspo-card:hover {
  border-color: #3a3d52;
  transform: translateY(-1px);
}

.inspo-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-weight: 600;
}

.tag-idea { background: rgba(108, 140, 255, 0.15); color: var(--accent); }
.tag-hot { background: rgba(245, 92, 122, 0.15); color: var(--red); }
.tag-draft { background: rgba(240, 160, 80, 0.15); color: var(--orange); }
.tag-done { background: rgba(78, 203, 113, 0.15); color: var(--green); }

.inspo-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
}

.inspo-desc {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}

.inspo-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}

/* ========== VIDEO CARDS ========== */
.video-card {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: var(--transition);
}

.video-card:hover {
  border-color: #3a3d52;
}

/* ========== DAILY GOODNOTES (每日好物) ========== */
.feed-head {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 12px;
}
.feed-head:first-of-type { margin-top: 4px; }
.feed-head .ft { font-size: 14px; font-weight: 700; color: var(--text); }
.feed-head .fd { font-size: 11px; color: var(--text-muted); margin-left: auto; }
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
  gap: 12px;
}
.good-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: var(--transition);
}
.good-card:hover { border-color: #3a3d52; transform: translateY(-2px); }
.good-cover {
  height: 116px; position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
}
.good-cover .plat {
  position: absolute; top: 8px; left: 8px;
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  background: rgba(0,0,0,.4); color: #fff;
}
.good-cover .plus {
  position: absolute; top: 8px; right: 8px;
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: rgba(0,0,0,.4); color: #fff; cursor: pointer;
  border: none; font-family: inherit; line-height: 1; text-decoration: none;
}
.good-cover .plus:hover { background: rgba(0,0,0,.65); }
.good-body { padding: 11px 13px 13px; display: flex; flex-direction: column; flex: 1; }
.good-title { font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
.good-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.good-tag {
  font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
  background: rgba(108,140,255,.12); color: var(--accent);
}
.good-note { font-size: 11.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; flex: 1; }
.good-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.good-meta a { color: var(--accent); text-decoration: none; }

/* ===== 英语学习 PETS三级 ===== */
.eng-progress { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
.eng-progress-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
.eng-progress-top span:last-child { color: var(--accent); font-weight: 600; }
.eng-bar { height: 8px; background: var(--bg-input); border-radius: 99px; overflow: hidden; }
.eng-bar-fill { height: 100%; background: linear-gradient(90deg, #7c5cff, #b0666d); border-radius: 99px; transition: width .3s ease; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.word-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.word-card.mastered { opacity: .5; }
.word-card .w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.word-card .w-word { font-size: 16px; font-weight: 700; color: var(--text); }
.word-card .w-phon { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.word-card .w-mean { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
.word-card .w-ex { color: var(--accent); font-size: 12px; margin-top: 6px; font-style: italic; }
.grammar-list { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.grammar-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.grammar-item .g-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.grammar-item .g-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }
.btn-accent { background: linear-gradient(90deg, #7c5cff, #b0666d); color: #fff; border: none; }
.btn-accent:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

.link-copy {
  margin-left: 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  font-size: 10px;
  padding: 1px 7px;
  cursor: pointer;
  font-family: inherit;
}
.link-copy:hover { color: var(--accent); border-color: var(--accent); }

.video-thumb {
  width: 100px;
  height: 66px;
  min-width: 100px;
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: var(--text-muted);
  overflow: hidden;
}

.video-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-info {
  flex: 1;
  min-width: 0;
}

.video-title {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.video-source {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.video-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== MEMO ========== */
.memo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 16px;
  margin-bottom: 8px;
  transition: var(--transition);
}

.memo-card:hover {
  border-color: #3a3d52;
  border-left-color: var(--accent);
}

.memo-text {
  font-size: 13.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.memo-time {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ========== MODULE: HIDDEN ========== */
.module {
  display: none;
  flex-direction: column;
  height: 100%;
}

.module.active {
  display: flex;
}

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-muted);
}

.empty-state .empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.empty-state p {
  font-size: 13px;
}

/* ========== SECTION ========== */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 20px 0 10px;
}
.section-title:first-child {
  margin-top: 0;
}

/* ========== STATS BAR ========== */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
}

.stat-box {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ========== OVERVIEW ========== */
.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.overview-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.overview-card h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mini-todo {
  font-size: 12.5px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}

.mini-todo:last-child {
  border-bottom: none;
}

.mini-inspo {
  font-size: 12.5px;
  padding: 5px 0;
  color: var(--text-secondary);
}

.overview-link {
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
}

.overview-link:hover {
  text-decoration: underline;
}

/* ========== FITNESS ========== */
.fit-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.fit-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.fit-card .lbl{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.fit-card .val{font-size:25px;font-weight:700;margin-top:6px;line-height:1.15}
.fit-card .sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.fit-banner{background:var(--bg-hover);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6}
.fit-banner b{color:var(--text)}
.fit-calc{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.9}
.fit-calc b{color:var(--accent,#7c5cff);font-size:14px}
.fit-calc .formula{font-size:11.5px;color:var(--text-muted);margin-top:6px}
.meal-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.meal-item:last-child{border-bottom:none}
.meal-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-weight:600;font-size:14px}
.meal-kcal{font-size:12px;color:var(--text-muted)}
.fit-photo-preview{margin-top:8px}
.fit-photo-preview img{max-width:120px;border-radius:8px;border:1px solid var(--border)}

.fit-text-preview{font-size:12.5px;color:var(--text-secondary);margin:8px 0 2px;line-height:1.9;min-height:1px}
.ttp-item{display:inline-block;margin:0 8px 6px 0;padding:2px 10px;background:var(--bg-hover);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-secondary)}
.ttp-item b{color:var(--text)}
.ttp-total{margin-top:6px;color:var(--text);font-size:13px}
.ttp-total b{color:var(--text);font-size:15px}
.ttp-empty{color:var(--text-muted);font-size:12px}

/* 磨砂玻璃卡片 */
.glass-card{
  background:var(--glass-bg);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:0 6px 28px var(--glass-shadow);
  position:relative;
  overflow:hidden;
}
.glass-card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.10),rgba(255,255,255,0));
  pointer-events:none;
}
.fit-glass{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
.fit-glass .gc-item{flex:1;min-width:62px;text-align:center;position:relative;z-index:1}
.fit-glass .gc-lbl{font-size:11px;color:var(--text-secondary);margin-bottom:5px}
.fit-glass .gc-val{font-size:19px;font-weight:700;color:var(--text);line-height:1.1}
.fit-glass .gc-val span{font-size:11px;font-weight:500;color:var(--text-muted);margin-left:2px}

/* ========== HOME PAGE ========== */
.home-section {
  margin-bottom: 18px;
}
.home-section-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.home-section-title .hs-badge {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-glow);
  padding: 2px 8px;
  border-radius: 10px;
}

/* AI report */
.ai-report {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
:root:not([data-theme="light"]) .ai-report {
  background: linear-gradient(135deg, #1a1d2e, #20243a);
}
.ai-report-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.ai-report-head .ar-title {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-refresh {
  background: var(--bg-hover);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
}
.ai-refresh:hover { background: var(--border); color: var(--text); }
.report-text {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  white-space: pre-wrap;
}
.report-text b { color: var(--text); }

/* Segmented control */
.seg-control {
  display: flex;
  gap: 4px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
  margin-bottom: 12px;
}
.seg-btn {
  flex: 1;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 12px;
  padding: 7px 4px;
  border-radius: 5px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: var(--transition);
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--bg-card);
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.seg-btn .seg-count {
  font-size: 10px;
  opacity: 0.7;
  margin-left: 3px;
}

/* ========== RESPONSIVE ========== */
/* ====== 手机端抽屉侧边栏 ====== */
@media (max-width: 768px) {
  body { flex-direction: row; } /* sidebar脱离文档流，body保持row */
  .sidebar {
    position: fixed;

function utf8ToBase64(str) {

function base64ToUtf8(b64) {

}
function ghApi(method, body) {

async function pushToCloud() {
  if (syncBusy) return;
  syncBusy = true;
  setSyncBadge('syncing', '☁️ 同步中…');
  data.__syncedAt = Date.now();
  saveData(data, true); // 先写本地（静默，避免递归触发同步）
  const content = utf8ToBase64(JSON.stringify(data));
  const body = { message: 'sync ' + new Date().toISOString(), content: content };
  if (cloudSha) body.sha = cloudSha;
  try {
    const res = await ghApi('PUT', body);
    if (res.ok) {
      const j = await res.json();
      cloudSha = (j.content && j.content.sha) ? j.content.sha : cloudSha;
      setSyncBadge('ok');
    } else {
      console.warn('push fail', res.status, await res.text());
      setSyncBadge('error');
    }
  } catch (e) {
    console.warn('push error', e);
    setSyncBadge('error');
  } finally {
    syncBusy = false;
  }
}
async function pullFromCloud() {
  setSyncBadge('syncing', '☁️ 同步中…');
  try {
    const res = await ghApi('GET');
    if (res.status === 200) {
      const j = await res.json();
      cloudSha = j.sha;
      const remote = JSON.parse(base64ToUtf8(j.content));
      const remoteTs = remote.__syncedAt || 0;
      const localTs = data.__syncedAt || 0;
      if (remoteTs > localTs) {
        // 云端更新：覆盖本地
        data = Object.assign(getDefaultData(), remote);
        data.fitness = (remote && remote.fitness) ? normalizeFitness(remote.fitness) : (data.fitness || normalizeFitness());
        saveData(data, true);
        renderAll();
        setSyncBadge('ok');
      } else {
        // 本地更新或首次：推上去
        await pushToCloud();
      }
    } else if (res.status === 404) {
      cloudSha = null;
      await pushToCloud(); // 首次运行：创建 data.json
    } else {
      setSyncBadge('error');
    }
  } catch (e) {
    console.warn('pull error', e);
    setSyncBadge('error');
  }
}

  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 把任意时间字段归一为 "YYYY-MM-DD"，用于「今日/本周」判断。
// 兼容：显式 date 字段、"2026-07-24 09:30"、"2026/7/24 09:30"，
// 以及旧数据里 toLocaleString 生成的 "7/24 09:30"（无年份，按当前年补全）。
function itemDay(item) {
  if (!item) return '';
  if (item.date) return item.date;                 // 新建项带显式 date，最可靠
  const c = item.createdAt || '';
  let m = String(c).match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // 无年份：按当前年补全（如 "7/24 09:30"）
  let m2 = String(c).match(/(\d{1,2})[^\d]+(\d{1,2})/);
  if (m2) {
    const y = new Date().getFullYear();
    return `${y}-${String(m2[1]).padStart(2,'0')}-${String(m2[2]).padStart(2,'0')}`;
  }
  return '';
}

// --- week / due helpers ---
function getWeekStart() {
  const d = new Date();
  const day = d.getDay(); // 0=Sunday
  const diff = (day === 0) ? -6 : 1 - day; // Monday start
  const ws = new Date(d);
  ws.setDate(d.getDate() + diff);
  return ws.toISOString().slice(0,10);
}
function getWeekEnd() {
  const ws = getWeekStart();
  const we = new Date(ws);
  we.setDate(we.getDate() + 6);
  return we.toISOString().slice(0,10);
}
function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const ws = getWeekStart(), we = getWeekEnd();
  return dateStr >= ws && dateStr <= we;
}
function getOverdue() {
  const today = todayStr();
  return data.todos.filter(t => !t.done && t.due && t.due < today);
}
function fmtDateShort(s) {
  if (!s) return '';
  return s.slice(5).replace('-', '/'); // MM/DD
}

// ==================== 复制小红书链接（手机端兼容） ====================
// 复制的是笔记分享链接（xhslink.com 短链或 explore 深链），
// 手机上复制后发到微信/QQ，点开即可唤起小红书APP打开该笔记。
function copyLink(url, btn) {
  if (!url) return;
  const done = () => { const t = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => { btn.textContent = t; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); cb && cb(); } catch (e) {}
  document.body.removeChild(ta);
}
function copyDaily(i, btn) {
  const feed = (typeof DAILY_GOODNOTES !== 'undefined' && DAILY_GOODNOTES) ? DAILY_GOODNOTES : [];
  copyLink(feed[i] ? (feed[i].url || '') : '', btn);
}
function copyGood(id, btn) {
  const g = data.goodnotes.find(x => x.id === id);
  copyLink(g ? (g.url || '') : '', btn);
}
function copyVideo(id, btn) {
  const v = data.videos.find(x => x.id === id);
  copyLink(v ? (v.url || '') : '', btn);
}

function toggleWordMastered(id) {
  const w = data.english.words.find(x => x.id === id);
  if (w) { w.mastered = !w.mastered; saveData(data); renderAll(); }
}

function deleteWord(id) {
  data.english.words = data.english.words.filter(x => x.id !== id);
  saveData(data);
  renderAll();
}

function toggleCoreMastered(id) {
  if (!data.english) data.english = { words: [], masteredCore: [] };
  if (!data.english.masteredCore) data.english.masteredCore = [];
  const i = data.english.masteredCore.indexOf(id);
  if (i >= 0) data.english.masteredCore.splice(i, 1);
  else data.english.masteredCore.push(id);
  saveData(data);
  renderAll();
}

const THEME_KEY = 'saki_dashboard_theme';
const THEME_ORDER = ['auto', 'light', 'dark'];
const THEME_META = {
  auto:  { icon: '🌗', label: '跟随系统' },
  light: { icon: '🌞', label: '浅色' },
  dark:  { icon: '🌙', label: '深色' }
};
function getTheme() {
  return localStorage.getItem(THEME_KEY) || 'auto';
}
function applyTheme(t) {
  const root = document.documentElement;
  root.setAttribute('data-theme', t);
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const effectiveDark = t === 'dark' ? true : (t === 'light' ? false : !prefersLight);
  const mc = document.querySelector('meta[name="theme-color"]');
  const sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (mc) mc.setAttribute('content', effectiveDark ? '#0f1117' : '#f4f5fa');
  if (sb) sb.setAttribute('content', effectiveDark ? 'black-translucent' : 'default');
  const btn = document.getElementById('themeBtn');
  if (btn) { const m = THEME_META[t]; btn.textContent = m.icon + ' ' + m.label; }
  localStorage.setItem(THEME_KEY, t);
}
function cycleTheme() {
  const cur = getTheme();
  const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
  applyTheme(next);
}
// 系统主题变化时，若处于“跟随系统”模式则实时跟随
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (getTheme() === 'auto') applyTheme('auto');
});

function exportData() {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yang-dashboard-' + todayStr() + '.json';
  a.click();
}

function importData(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      data = Object.assign(getDefaultData(), imported);
      saveData(data);
      renderAll();
      alert('导入成功！已合并 ' + Object.keys(imported).length + ' 类数据');
    } catch(err) { alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
}

// 触摸滑动：右滑打开 / 左滑关闭
(function() {
  var touchStartX = 0, touchStartY = 0, isSwipe = false;
  var sb = document.querySelector('.sidebar');
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isSwipe = false;
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    var dx = e.touches[0].clientX - touchStartX;
    var dy = Math.abs(e.touches[0].clientY - touchStartY);
    if (Math.abs(dx) > dy && Math.abs(dx) > 20) isSwipe = true;
    // 跟随手指拖动（仅左边缘区域或已打开时）
    if (!isSwipe) return;
    var open = document.body.classList.contains('sidebar-open');
    if (!open && touchStartX < 30 && dx > 0) {
      sb.style.transform = 'translateX(' + Math.min(dx - 260, 0) + 'px)';
      sb.style.transition = 'none';
    } else if (open && dx < 0) {
      sb.style.transform = 'translateX(' + Math.max(dx, -260) + 'px)';
      sb.style.transition = 'none';
    }
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!isSwipe) { sb.style.transition = ''; sb.style.transform = ''; return; }
    var dx = e.changedTouches[0].clientX - touchStartX;
    var open = document.body.classList.contains('sidebar-open');
    sb.style.transition = '';
    sb.style.transform = '';
    // 滑动超过80px算有效操作
    if (!open && dx > 80) toggleSidebar();
    else if (open && dx < -80) toggleSidebar();
  }, { passive: true });
})();

// 文字描述 → 估算热量：支持品牌名、前后数量、去"的/了"助词
function estimateCalories(text) {
  if (!text) return { total: 0, items: [] };
  // 清洗：去空格、去"的/了"等助词，便于品牌匹配（如 manner的咖啡 → manner咖啡）
  const t = String(text).replace(/\s+/g, '').replace(/[的了的]/g, '');
  const CN_NUM = { '一':1,'壹':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'半':0.5 };
  const UNIT = '碗个份根片杯块条只袋罐串勺把枚瓶盒';
  const longest = f => Math.max(f.kw.length, ...(f.aliases || []).map(a => a.length));
  // 具体单品（kw 更长）优先于笼统品牌词，避免"星巴克拿铁"被"星巴克"抢占
  const ordered = FOOD_CALORIE_DB.slice().sort((a, b) => (b.kw.length - a.kw.length) || (longest(b) - longest(a)));
  const consumed = [];
  const items = [];
  let total = 0;
  const toNum = s => (CN_NUM[s] != null ? CN_NUM[s] : parseFloat(s));
  const parseQty = (idx, end) => {
    const before = t.slice(Math.max(0, idx - 10), idx);
    let m = before.match(new RegExp('(?:(\\d+(?:\\.\\d+)?)|([一二两三四五六七八九半]))\\s*[' + UNIT + ']*\\s*$'));
    if (m) return toNum(m[1] || m[2]);
    const after = t.slice(end, end + 8);
    m = after.match(new RegExp('^\\s*[' + UNIT + ']*\\s*(?:(\\d+(?:\\.\\d+)?)|([一二两三四五六七八九半]))\\s*[' + UNIT + ']*'));
    if (m) return toNum(m[1] || m[2]);
    return 1;
  };
  for (const food of ordered) {
    const keys = [food.kw, ...(food.aliases || [])].sort((a, b) => b.length - a.length);
    for (const k of keys) {
      let from = 0, idx;
      while ((idx = t.indexOf(k, from)) >= 0) {
        const end = idx + k.length;
        const overlap = consumed.some(c => idx < c[1] && end > c[0]);
        if (!overlap) {
          const qty = parseQty(idx, end);
          const cal = Math.round(food.cal * qty);
          items.push({ name: (qty > 1 ? qty + '×' : '') + k, cal: cal });
          total += cal;
          consumed.push([idx, end]);
          from = end;
          break;
        }
        from = idx + 1;
      }
    }
  }
  return { total, items };
}

function getFitness() {
  if (!data.fitness) data.fitness = { startWeight:null, currentWeight:null, targetWeight:null, height:null, age:null, gender:'f', activity:1.375, meals:[] };
  if (!data.fitness.meals) data.fitness.meals = [];
  return data.fitness;
}
function fitPhotoStore() {
  try { return JSON.parse(localStorage.getItem('saki_fit_photos') || '{}'); }
  catch(e) { return {}; }
}
function fitSavePhoto(id, dataUrl) {
  const s = fitPhotoStore();
  s[id] = dataUrl;
  try { localStorage.setItem('saki_fit_photos', JSON.stringify(s)); } catch(e) {}
}
function fitGetPhoto(id) {
  return fitPhotoStore()[id] || '';
}
function calcBMR(f) {
  const w = Number(f.currentWeight), h = Number(f.height), a = Number(f.age);
  if (!w || !h || !a) return null;
  const base = 10 * w + 6.25 * h - 5 * a;
  return f.gender === 'm' ? base + 5 : base - 161;
}
function calcTDEE(f) {
  const bmr = calcBMR(f);
  if (bmr == null) return null;
  return bmr * (Number(f.activity) || 1.2);
}
function renderFitness() {
  const f = getFitness();
  pendingFitPhoto = '';
  const today = todayStr();
  const current = f.currentWeight;
  const start = f.startWeight;
  const lost = (start != null && current != null) ? (start - current) : null;
  const todayMeals = f.meals.filter(m => m.date === today);
  const todayKcal = todayMeals.reduce((s, m) => s + (Number(m.kcal) || 0), 0);
  const bmr = calcBMR(f);
  const tdee = calcTDEE(f);
  const deficit = tdee != null ? (tdee - todayKcal) : null;
  const recommend = tdee != null ? (tdee - 500) : null;
  const el = document.getElementById('fitnessContent');
  el.innerHTML = `

        <div class='sub'>${start != null ? '初始 ' + start + ' kg' : '未设初始体重'}</div>
      </div>
      <div class='fit-card'>
        <div class='lbl'>🔥 今日热量</div>
        <div class='val'>${todayKcal}<span style='font-size:14px;font-weight:500;color:var(--text-muted)'> kcal</span></div>

      </div>
      <div class='fit-card'>
        <div class='lbl'>🎯 热量缺口</div>
        <div class='val'>${deficit != null ? (deficit >= 0 ? '+' + Math.round(deficit) : Math.round(deficit)) : '—'}<span style='font-size:14px;font-weight:500;color:var(--text-muted)'> kcal</span></div>
        <div class='sub'>${tdee != null ? '每日消耗 ' + Math.round(tdee) + ' kcal' : '完善身体数据可算'}</div>

    <div class='fit-banner'>
      💡 <b>热量缺口科学计算（Mifflin-St Jeor）：</b> BMR = 10×体重 + 6.25×身高 − 5×年龄 ${f.gender==='m'?'+5':'-161'}，TDEE = BMR × 活动系数，缺口 = TDEE − 今日摄入。

      ` : '填写 当前体重 / 身高 / 年龄 后自动计算 BMR 与 TDEE。'}
    </div>

    <div class='section-title'>🍽️ 今日热量（拍照 + 录入）</div>
    <div class='input-row' style='flex-wrap:wrap;align-items:flex-start'>
      <input type='file' id='fitPhoto' accept='image/*' capture='environment' style='display:none' onchange="handleFitPhoto(this.files[0])">
      <button class='btn btn-accent' onclick="document.getElementById('fitPhoto').click()">📷 拍照 / 上传</button>
      <input type='text' id='fitMealName' placeholder='餐名，如 午餐' style='min-width:120px'>
      <input type='number' id='fitMealKcal' placeholder='热量 kcal' style='width:120px'>
      <button class='btn btn-primary' onclick="addMeal()">添加</button>
      <button class='btn btn-accent' onclick="autoRecognizeMeal()">🤖 自动识别</button>
      <button class='btn btn-sm' title='视觉识别设置' onclick="toggleVisionSettings()">⚙️</button>
    </div>
    <div id='visionSettings' style='display:none;margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-size:13px'>
      <b>🤖 视觉识别设置</b>（仅存本机浏览器，不上传云端）
      <div style='margin-top:8px'>
        API Base：<input type='text' id='visBase' placeholder='https://api.openai.com/v1' style='width:240px'><br>
        API Key：<input type='password' id='visKey' placeholder='sk-...' style='width:240px;margin-top:6px'><br>
        模型名：<input type='text' id='visModel' placeholder='gpt-4o-mini' style='width:240px;margin-top:6px'><br>
        <span style='font-size:11px;color:var(--text-dim)'>支持 OpenAI 兼容格式（通义/智谱等均可）。注意：部分服务浏览器直连会被跨域(CORS)拦截，失败时可把照片发到对话让我识别。</span><br>
        <button class='btn btn-sm btn-primary' style='margin-top:8px' onclick="saveVisionSettings()">保存设置</button>
        <span id='visSaveMsg' style='margin-left:8px;color:var(--green,#16a34a)'></span>
      </div>
    </div>

    <div class='section-title' style='margin-top:18px'>✍️ 文字描述自动估算热量</div>
    <div class='input-row' style='flex-wrap:wrap;align-items:flex-start'>
      <input type='text' id='fitMealText' placeholder='描述你吃了什么，如：2碗米饭 一个鸡腿 一杯牛奶 一个苹果' style='min-width:240px;flex:1' oninput='previewTextCalories()'>
      <button class='btn btn-primary' onclick="addMealFromText()">识别并添加</button>
    </div>
    <div id='fitTextPreview' class='fit-text-preview'></div>

    <div id='fitPhotoPreview' class='fit-photo-preview'></div>
    <div id='fitMealList'></div>
  `;

  const list = document.getElementById('fitMealList');
  if (todayMeals.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:20px"><p>今天还没记录饮食，拍一张开始吧</p></div>';
  } else {
    list.innerHTML = todayMeals.map(m => `
      <div class='meal-item'>
        ${m.photoId ? `<img class='meal-thumb' src='${fitGetPhoto(m.photoId)}' alt=''>` : ''}
        <div class='meal-info'>
          <div class='meal-name'>${escHtml(m.name || '未命名')}</div>
          <div class='meal-kcal'>${m.kcal} kcal${m.photoId ? ' · 📷已附照片' : ''}</div>
        </div>
        <button class='btn btn-sm btn-danger' onclick="deleteMeal('${m.id}')">删除</button>
      </div>`).join('');
  }
}
function saveFitnessMeta() {
  const f = getFitness();
  const c = document.getElementById('fitCurrent').value.trim();
  const s = document.getElementById('fitStart').value.trim();
  const t = document.getElementById('fitTarget').value.trim();
  const h = document.getElementById('fitHeight').value.trim();
  const a = document.getElementById('fitAge').value.trim();
  const g = document.getElementById('fitGender').value;
  const act = Number(document.getElementById('fitActivity').value);
  f.currentWeight = c === '' ? null : Number(c);
  f.startWeight = s === '' ? null : Number(s);
  f.targetWeight = t === '' ? null : Number(t);
  f.height = h === '' ? null : Number(h);
  f.age = a === '' ? null : Number(a);
  f.gender = g;
  f.activity = act;
  if (f.startWeight == null && f.currentWeight != null) f.startWeight = f.currentWeight;
  saveData(data);
  renderFitness();
}
function handleFitPhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.7); }
      catch(err) { dataUrl = e.target.result; }
      pendingFitPhoto = dataUrl;
      const pv = document.getElementById('fitPhotoPreview');
      if (pv) pv.innerHTML = '<img src="' + dataUrl + '" alt="预览"><div style="font-size:12px;color:var(--text-muted);margin-top:4px">照片已就绪，填好餐名和热量点「添加」即可（照片仅存本机）</div>';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function addMeal() {
  const f = getFitness();
  const name = document.getElementById('fitMealName').value.trim();
  const kcal = document.getElementById('fitMealKcal').value.trim();
  if (!name && !kcal) return;
  const id = uid();
  const meal = { id: id, date: todayStr(), name: name, kcal: kcal === '' ? 0 : Number(kcal), photoId: pendingFitPhoto ? id : null };
  if (pendingFitPhoto) { fitSavePhoto(id, pendingFitPhoto); pendingFitPhoto = ''; }
  f.meals.unshift(meal);
  saveData(data);
  renderFitness();
}

// ===== 视觉识别（OpenAI 兼容格式，API key 仅存本机浏览器，不进仓库/云同步）=====
const VISION_CFG_KEY = 'saki_vision_cfg';
function getVisionCfg() {
  try { return JSON.parse(localStorage.getItem(VISION_CFG_KEY)) || {}; } catch (e) { return {}; }
}
function saveVisionCfg(c) {
  try { localStorage.setItem(VISION_CFG_KEY, JSON.stringify(c)); } catch (e) {}
}
function toggleVisionSettings() {
  const box = document.getElementById('visionSettings');
  if (!box) return;
  const show = !box.style.display || box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  if (show) {
    const cfg = getVisionCfg();
    const b = document.getElementById('visBase'); if (b && cfg.baseUrl) b.value = cfg.baseUrl;
    const k = document.getElementById('visKey'); if (k && cfg.key) k.value = cfg.key;
    const m = document.getElementById('visModel'); if (m && cfg.model) m.value = cfg.model;
  }
}
function saveVisionSettings() {
  const b = document.getElementById('visBase').value.trim();
  const k = document.getElementById('visKey').value.trim();
  const m = document.getElementById('visModel').value.trim();
  if (!b || !k) { alert('请填写 API Base 和 Key'); return; }
  saveVisionCfg({ baseUrl: b, key: k, model: m || 'gpt-4o-mini' });
  const msg = document.getElementById('visSaveMsg');
  if (msg) { msg.textContent = '✓ 已保存'; setTimeout(function () { msg.textContent = ''; }, 2000); }
}
async function autoRecognizeMeal() {
  const cfg = getVisionCfg();
  if (!cfg.key || !cfg.baseUrl) {
    alert('请先点 ⚙️ 填写视觉识别 API 的 Base / Key / 模型');
    toggleVisionSettings();
    return;
  }
  if (!pendingFitPhoto) {
    alert('请先拍一张食物照片（点「📷 拍照 / 上传」）');
    return;
  }
  const btn = document.querySelector('button[onclick="autoRecognizeMeal()"]');
  if (btn) { btn.disabled = true; btn.textContent = '🔄 识别中…'; }
  try {
    const url = cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({
        model: cfg.model || 'gpt-4o-mini',
        messages: [
          { role: 'system', content: '你是营养助手。用户发一张食物照片，请估算这份食物的总热量（kcal）。只返回一个整数，不要任何解释或单位。' },
          { role: 'user', content: [
            { type: 'text', text: '这份食物总共大约多少 kcal？只返回一个整数。' },
            { type: 'image_url', image_url: { url: pendingFitPhoto } }
          ] }
        ],
        max_tokens: 30
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    const num = parseInt((txt + '').replace(/[^\d]/g, ''), 10);
    if (isNaN(num)) throw new Error('返回无法解析为数字：' + txt);
    document.getElementById('fitMealKcal').value = num;
    const nm = document.getElementById('fitMealName');
    if (nm && !nm.value.trim()) nm.value = 'AI识别餐';
  } catch (e) {
    alert('自动识别失败：' + e.message + '\n\n常见原因：\n① 浏览器跨域(CORS)拦截——部分 API 不支持网页直连；\n② key / Base 错误或额度不足。\n\n可改用：把照片发到咱们 WorkBuddy 对话，我(Saki)帮你识别后你填回来。');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '🤖 自动识别'; }
  }
}
function previewTextCalories() {
  const t = document.getElementById('fitMealText');
  const pv = document.getElementById('fitTextPreview');
  if (!t || !pv) return;
  const text = t.value.trim();
  if (!text) { pv.innerHTML = ''; return; }
  const r = estimateCalories(text);
  if (r.items.length === 0) {
    pv.innerHTML = '<div class="ttp-empty">未识别到已知食物，可试试：manner拿铁 / 瑞幸生椰拿铁 / 星巴克拿铁 / 黄焖鸡米饭 / 螺蛳粉 / 麻辣烫 / 一碗米饭 / 半个苹果（已支持品牌名，数量可写「2杯」「半份」）</div>';
    return;
  }
  pv.innerHTML = '<div class="ttp-list">' + r.items.map(i => `<span class="ttp-item">${escHtml(i.name)} <b>${i.cal}</b> kcal</span>`).join(' + ') + '</div>'
    + `<div class="ttp-total">合计估算 ≈ <b>${r.total}</b> kcal（点「识别并添加」记入今日）</div>`;
}
function addMealFromText() {
  const t = document.getElementById('fitMealText');
  if (!t) return;
  const text = t.value.trim();
  if (!text) return;
  const r = estimateCalories(text);
  if (r.items.length === 0 || r.total <= 0) {
    const pv = document.getElementById('fitTextPreview');
    if (pv) pv.innerHTML = '<div class="ttp-empty">未识别到已知食物，可用上方「餐名 + 热量」手动添加，例如「肯德基原味鸡 250」「星巴克拿铁 220」。已支持 manner / 瑞幸 / 星巴克 / 喜茶 / 霸王茶姬 / 蜜雪 等品牌。</div>';
    return;
  }
  const f = getFitness();
  const id = uid();
  f.meals.unshift({ id: id, date: todayStr(), name: text, kcal: r.total, photoId: null, auto: true });
  saveData(data);
  renderFitness();
}
function deleteMeal(id) {
  const f = getFitness();
  f.meals = f.meals.filter(m => m.id !== id);
  const s = fitPhotoStore();
  if (s[id]) { delete s[id]; try { localStorage.setItem('saki_fit_photos', JSON.stringify(s)); } catch(e) {} }
  saveData(data);
  renderFitness();
}
</script>
